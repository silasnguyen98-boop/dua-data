# Upstream — Next.js container (app service name)
upstream duadata_backend {
    server app:3000;
}

# ── Single HTTP server (ACME challenge + HTTP→HTTPS redirect) ──────────────
# No SSL configured here — HTTPS is handled by the second server block below.
# If SSL certs are missing, nginx starts on :80 only and serves a maintenance page.
server {
    listen 80 default_server;
    server_name _;

    # Certbot ACME challenge (must be reachable before HTTPS is ready)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS if certs exist, else 503
    location / {
        root /etc/nginx/html;
        index index.html;
        try_files /maintenance.html =503;
    }
}

# ── HTTPS server (only valid if SSL certs are present) ───────────────────────
# The `ssl_certificate` directives MUST exist or nginx -t fails to load this block.
# Certbot populates these on first run. To regenerate:
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d duadata.net -d www.duadata.net -d student.duadata.net --force-renewal
ssl_certificate     /etc/letsencrypt/live/duadata.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/duadata.net/privkey.pem;
ssl_dhparam        /etc/letsencrypt/ssl-dhparams.pem;
include            /etc/letsencrypt/options-ssl-nginx.conf;

server {
    listen 443 ssl;
    server_name duadata.net www.duadata.net student.duadata.net;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Static assets (Next.js build) ───────────────────────────────────────
    location /_next/static/ {
        proxy_pass         http://duadata_backend;
        proxy_cache_valid  200 60m;
        expires            60m;
        add_header         Cache-Control "public, immutable";
    }

    # ── Proxy to Next.js ─────────────────────────────────────────────────────
    location / {
        proxy_pass          http://duadata_backend;
        proxy_http_version  1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    90s;
        proxy_intercept_errors off;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /etc/nginx/html;
    }
}
